<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ralskies Content Engine</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="production-progress.css">
</head>
<body>
  <div class="app">
    <aside>
      <nav id="nav" aria-label="Application">
        <button class="active" data-view="dashboard">Dashboard</button>
        <button data-view="batches">Batches</button>
        <button data-view="queue">Upload Queue</button>
        <button data-view="youtube">YouTube</button>
        <button data-view="calendar">Calendar</button>
        <button data-view="videos">Local Videos</button>
        <button data-view="title-lab">Title Lab</button>
        <button data-view="settings">Settings</button>
        <button data-view="logs">Logs / Recovery</button>
      </nav>
      <div class="side-note"><span class="status-dot"></span>Live services<br>Approval gated</div>
    </aside>
    <main>
      <header>
        <div>
          <p class="eyebrow">RALSKIES PRODUCTION</p>
          <h1 id="view-title">Dashboard</h1>
        </div>
        <div class="header-actions">
          <span class="pill">PRIVATE FIRST</span>
          <button class="ghost" id="refresh">Refresh</button>
        </div>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script src="progress-view.js"></script>
  <script src="app.js"></script>
  <script src="recovery-finalize.js"></script>
</body>
</html>
